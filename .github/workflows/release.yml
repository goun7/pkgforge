name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  # F1: testsiz publish yok. Tag push'unda tam suit + lint kapıları
  # build'den ÖNCE koşar; kırmızıysa release durur.
  gate:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Qt system libs (PyQt6 needs GL/EGL)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 \
            binutils file libarchive-tools rpm zstd
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Ruff (pinned, CI-parity)
        run: python -m ruff check .
      - name: Mypy (core+cli+main+config)
        run: python -m mypy core/ cli.py main.py config.py --ignore-missing-imports --no-error-summary
      - name: Bandit (core+entry points)
        run: python -m bandit -r core/ cli.py main.py config.py -ll --skip B101,B311
      - name: Full test suite (no coverage, fail-fast off)
        run: python -m pytest tests/ -q --tb=short -p no:cacheprovider

  build:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # SLSA provenance attestation (keyless, OIDC)
      attestations: write # persist the attestation to the repo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: SHA256SUMS
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: SBOM (SPDX + CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.9.0
        with:
          path: ./
          format: spdx-json
          output-file: dist/pkgforge.spdx.json

      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.9.0
        with:
          path: ./
          format: cyclonedx-json
          output-file: dist/pkgforge.cyclonedx.json

      - name: Attest build provenance (SLSA, Sigstore)
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: "dist/*.whl, dist/*.tar.gz, dist/SHA256SUMS, dist/pkgforge.spdx.json, dist/pkgforge.cyclonedx.json"

      - name: Upload dist artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkgforge-dist
          path: dist/
          if-no-files-found: error

  # S1: release desktop bundle — same steps as test.yml desktop-build.
  desktop:
    needs: gate
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      VENV_PY: python3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Python build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Install Qt + Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev binutils file
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable@2026-09-08
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: desktop/src-tauri
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: Build sidecar binary (triple-suffixed)
        run: bash desktop/scripts/build-sidecar.sh
      - name: Install frontend deps
        working-directory: desktop
        run: pnpm install --frozen-lockfile
      - name: Build desktop .deb (release)
        working-directory: desktop
        run: pnpm tauri build
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkgforge-desktop-deb
          path: desktop/src-tauri/target/release/bundle/deb/
          if-no-files-found: error

  publish:
    needs: [build, desktop]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pkgforge-dist
          path: dist/
      - name: Download desktop artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pkgforge-desktop-deb
          path: desktop-deb/

      - name: Attest final release bundle (incl. desktop .deb)
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: "desktop-deb/*.deb, desktop-deb/SHA256SUMS"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/pkgforge.spdx.json
            dist/pkgforge.cyclonedx.json
            desktop-deb/*.deb
            desktop-deb/SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: false
