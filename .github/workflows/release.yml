name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  # F1: testsiz publish yok. Tag push'unda tam suit + lint kapıları
  # build'den ÖNCE koşar; kırmızıysa release durur.
  gate:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Qt system libs (PyQt6 needs GL/EGL)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 \
            binutils file libarchive-tools rpm zstd
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Ruff (pinned, CI-parity)
        run: python -m ruff check .
      - name: Mypy (strict, core+cli+main+config+ui)
        run: python -m mypy core/ cli.py main.py config.py ui/ --ignore-missing-imports --strict --no-error-summary
      - name: Bandit (core+entry points)
        run: python -m bandit -r core/ cli.py main.py config.py -ll --skip B101,B311
      - name: Full test suite (no coverage, fail-fast off)
        run: python -m pytest tests/ -q --tb=short -p no:cacheprovider

  build:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # SLSA provenance attestation (keyless, OIDC)
      attestations: write # persist the attestation to the repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: SHA256SUMS
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: SBOM (SPDX + CycloneDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: ./
          format: spdx-json
          output-file: dist/pkgforge.spdx.json

      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: ./
          format: cyclonedx-json
          output-file: dist/pkgforge.cyclonedx.json

      - name: Attest build provenance (SLSA, Sigstore)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.whl, dist/*.tar.gz, dist/SHA256SUMS, dist/pkgforge.spdx.json, dist/pkgforge.cyclonedx.json"

      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkgforge-dist
          path: dist/
          if-no-files-found: error

  # S1: release desktop bundle — same steps as test.yml desktop-build.
  desktop:
    needs: gate
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      VENV_PY: python3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Python build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Install Qt + Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev binutils file
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable@2026-09-08
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop/src-tauri
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: Build sidecar binary (triple-suffixed)
        run: bash desktop/scripts/build-sidecar.sh
      - name: Install frontend deps
        working-directory: desktop
        run: pnpm install --frozen-lockfile
      - name: Build desktop .deb (release)
        working-directory: desktop
        run: pnpm tauri build
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkgforge-desktop-deb
          path: desktop/src-tauri/target/release/bundle/deb/
          if-no-files-found: error

  publish:
    needs: [build, desktop]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pkgforge-dist
          path: dist/
      - name: Download desktop artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pkgforge-desktop-deb
          path: desktop-deb/

      - name: Attest final release bundle (incl. desktop .deb)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "desktop-deb/*.deb, desktop-deb/SHA256SUMS"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/pkgforge.spdx.json
            dist/pkgforge.cyclonedx.json
            desktop-deb/*.deb
            desktop-deb/SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: false
