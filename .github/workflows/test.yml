name: PkgForge CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Test Suite
        run: |
          python -m pytest tests/ -v --tb=short --cov=core --cov-report=term-missing

      - name: Type Check
        run: |
          pip install mypy
          mypy core/ --ignore-missing-imports --no-error-summary || true

      - name: Security Scan (Bandit)
        run: |
          pip install bandit
          bandit -r core/ -ll --skip B101,B311 || true

  benchmark:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run Benchmarks
        run: |
          python -m pytest tests/ -v --tb=short -q

      - name: Module Import Check
        run: |
          python -c "
          import core.security
          import core.history_db
          import core.provenance
          import core.reproducible_build
          import core.malware_scanner
          import core.delta_updater
          import core.oci_builder
          import core.snapshot_manager
          import core.flatpak_converter
          import core.appimage_converter
          import core.cli_bridge
          import core.subprocess_converters
          print('All modules imported successfully')
          "

      - name: CLI Help Check
        run: |
          python main.py --help
          python main.py convert --help
