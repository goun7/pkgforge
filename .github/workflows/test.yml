name: PkgForge CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-timeout hypothesis

      - name: Run Test Suite
        run: |
          python -m pytest tests/ -v --tb=short --cov=core --cov-report=term-missing --cov-report=html:htmlcov --cov-report=json:coverage.json --cov-fail-under=48

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: htmlcov/
          retention-days: 14

      - name: Update Coverage Badge
        if: matrix.python-version == '3.12' && github.event_name == 'push' && github.repository_owner == 'goun7'
        continue-on-error: true
        run: |
          COVERAGE=$(python -c "import json; print(round(json.load(open('coverage.json'))['totals']['percent_covered']))")
          if [ "$COVERAGE" -ge 80 ]; then COLOR="brightgreen"; elif [ "$COVERAGE" -ge 60 ]; then COLOR="yellow"; else COLOR="red"; fi
          sed -i "s|coverage-[0-9]*%25-[a-z]*|coverage-${COVERAGE}%25-${COLOR}|g" README.md

      - name: Commit Badge Update
        if: matrix.python-version == '3.12' && github.event_name == 'push' && github.repository_owner == 'goun7'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "Update coverage badge [skip ci]"
          git push

      - name: Type Check (strict)
        run: |
          pip install mypy
          mypy core/ --ignore-missing-imports --no-error-summary

      - name: Security Scan (Bandit)
        run: |
          pip install bandit
          bandit -r core/ -ll --skip B101,B311 || true

  benchmark:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Benchmarks (regression gate)
        run: |
          python -c "
          from core.benchmark import run_benchmarks
          report = run_benchmarks(quick=True)
          print(report.summary())
          # HARD GATE: Fail if any benchmark failed
          assert report.passed, 'Benchmarks failed!'
          # HARD GATE: Fail if total time > 30 seconds
          THRESHOLD_MS = 30000
          if report.total_duration_ms > THRESHOLD_MS:
              print(f'FATAL: Benchmarks took {report.total_duration_ms}ms (threshold: {THRESHOLD_MS}ms)')
              print('Performance regression detected — blocking merge.')
              raise SystemExit(1)
          print(f'Benchmark passed: {report.total_duration_ms}ms (threshold: {THRESHOLD_MS}ms)')
          "

      - name: Module Import Check (PyQt6-free)
        run: |
          python -c "
          import importlib
          modules = [
              'core.security', 'core.history_db', 'core.provenance',
              'core.reproducible_build', 'core.malware_scanner',
              'core.delta_updater', 'core.oci_builder',
              'core.snapshot_manager', 'core.snapshot_cleanup',
              'core.flatpak_converter', 'core.appimage_converter',
              'core.cli_bridge', 'core.subprocess_converters',
              'core.dep_resolver', 'core.dep_graph', 'core.abi_scanner',
              'core.from_source',
              'core.offline_cache', 'core.retry', 'core.quality_score',
              'core.aur_publish', 'core.rollback_verify',
              'core.plugins', 'core.pipeline',
              'core.sbom', 'core.benchmark', 'core.structured_log',
              'core.streaming',
          ]
          for mod in modules:
              importlib.import_module(mod)
          print(f'All {len(modules)} modules imported successfully (PyQt6-free)')
          "

      - name: CLI Help Check
        run: |
          python main.py --help
          python main.py convert --help
          python main.py quality --help
          python main.py publish --help
          python main.py verify-rollback --help
          python main.py sbom --help
          python main.py attest --help
          python main.py health --help
          python main.py benchmark --quick

  lint-hardened:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.6.9
      # F4.10 gate scoped to the Faz 3/4 hardened surface; widen as legacy
      # files (quality_score, security, ...) get their 83 pre-existing
      # findings cleaned up.
      - name: Ruff (hardened surface)
        run: |
          ruff check core/api_server.py core/scheduler.py             core/secrets_store.py core/privileged.py core/cloud_sync.py             core/dbus_service.py core/pipeline.py tests/

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: Install deps
        working-directory: desktop
        run: pnpm install --frozen-lockfile
      - name: Vitest
        working-directory: desktop
        run: pnpm vitest run
      - name: Build web shell
        working-directory: desktop
        run: pnpm build

  tauri-cargo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Cargo check
        working-directory: desktop/src-tauri
        run: cargo check --all-features

  keyring-live:
    # F5.6: validate jeepney marshalling against a REAL Secret Service.
    # Local dev machines often lack one (KDE kwalletd squats the name but
    # does not implement org.freedesktop.secrets.Service), so the live
    # test skips there; here gnome-keyring provides the reference impl.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus gnome-keyring libglib2.0-bin
      - name: Install python deps
        run: pip install jeepney pytest pytest-timeout
      - name: Live Secret Service roundtrip
        run: |
          dbus-run-session -- bash -c '
            set -e
            eval "$(echo -n "" | gnome-keyring-daemon --unlock --daemonize --components=secrets)"
            python -m pytest tests/test_secrets_store.py -k live -q
          '
