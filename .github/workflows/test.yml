name: PkgForge CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Test Suite
        run: |
          python -m pytest tests/ -v --tb=short --cov=core --cov-report=term-missing

      - name: Type Check
        run: |
          pip install mypy
          mypy core/ --ignore-missing-imports --no-error-summary || true

      - name: Security Scan (Bandit)
        run: |
          pip install bandit
          bandit -r core/ -ll --skip B101,B311 || true

  benchmark:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run Benchmarks
        run: |
          python -c "
          from core.benchmark import run_benchmarks
          report = run_benchmarks(quick=True)
          print(report.summary())
          # Fail if any benchmark failed
          assert report.passed, 'Benchmarks failed!'
          # Fail if total time > 30 seconds (regression gate)
          if report.total_duration_ms > 30000:
              print(f'WARNING: Benchmarks took {report.total_duration_ms}ms (>30s)')
              print('This may indicate a performance regression.')
          print(f'Benchmark passed: {report.total_duration_ms}ms total')
          "

      - name: Module Import Check (PyQt6-free)
        run: |
          python -c "
          # Verify all core modules import WITHOUT PyQt6
          import importlib
          modules = [
              'core.security', 'core.history_db', 'core.provenance',
              'core.reproducible_build', 'core.malware_scanner',
              'core.delta_updater', 'core.oci_builder',
              'core.snapshot_manager', 'core.snapshot_cleanup',
              'core.flatpak_converter', 'core.appimage_converter',
              'core.cli_bridge', 'core.subprocess_converters',
              'core.dep_resolver', 'core.dep_graph', 'core.abi_scanner',
              'core.from_source', 'core.smart_fallback',
              'core.offline_cache', 'core.retry', 'core.quality_score',
              'core.aur_publish', 'core.rollback_verify',
              'core.plugins', 'core.pipeline',
          ]
          for mod in modules:
              importlib.import_module(mod)
          print(f'All {len(modules)} modules imported successfully (PyQt6-free)')
          "

      - name: CLI Help Check
        run: |
          python main.py --help
          python main.py convert --help
          python main.py quality --help
          python main.py publish --help
          python main.py verify-rollback --help
