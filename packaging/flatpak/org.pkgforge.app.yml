# F5.21 — DENEYSEL flatpak-builder manifesti.
#
# NOT: PkgForge bir paket donusturucudur ve pacman, debtap, polkit, systemd
# gibi sistem seviyesi araclar gerektirir. Flatpak kumturasi bu erisimi
# sinirladigi icin bu manifest bir BASLANGIC NOKTASIDIR; tam islevsel bir
# flatpak paketi ek entegrasyon (ozgurlukler, host erisimi) gerektirir.
app-id: org.pkgforge.app
runtime: org.kde.Platform
runtime-version: "6.7"
sdk: org.kde.Sdk
command: pkgforge
finish-args:
  # Paket yonetimi icin host erisimi gerekir (deneysel).
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=host
  - --talk-name=org.freedesktop.secrets
  - --system-talk-name=org.freedesktop.PolicyKit1
modules:
  - name: pkgforge
    buildsystem: simple
    build-commands:
      - install -Dm755 main.py /app/bin/pkgforge
      - install -Dm644 data/org.pkgforge.app.metainfo.xml
        /app/share/metainfo/org.pkgforge.app.metainfo.xml
      - install -Dm644 data/pkgforge.desktop
        /app/share/applications/org.pkgforge.app.desktop
      - install -Dm644 data/pkgforge.svg
        /app/share/icons/hicolor/scalable/apps/pkgforge.svg
    sources:
      - type: dir
        path: ../..
