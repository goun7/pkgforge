[package]
name = "pkgforge-desktop"
version = "2.0.0"
description = "PkgForge desktop UI (Tauri + Python sidecar)"
authors = ["goun7"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "pkgforge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
