[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pkgforge"
version = "2.0.0"
description = "Convert and install .deb/.rpm packages on Arch Linux with safety sandbox and CLI/GUI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "PkgForge Contributors"},
]
keywords = ["arch", "linux", "package", "deb", "rpm", "converter", "pkgforge"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
gui = ["PyQt6>=6.5.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "pytest-timeout>=2.0", "hypothesis>=6.0", "mypy>=1.0", "bandit>=1.7"]

[project.scripts]
pkgforge = "main:main"

[project.gui-scripts]
pkgforge-gui = "main:main"

[tool.setuptools]
py-modules = ["main", "cli", "config"]

[tool.setuptools.packages.find]
include = ["core*", "core.plugins*", "ui*", "i18n*"]

[tool.setuptools.package-data]
"ui.resources" = ["*.svg", "*.png"]

# Ship desktop entry, icons, polkit policy, completions and install helper
# scripts inside the wheel so console scripts and the GUI can find them
# after a pip install.
[tool.setuptools.data-files]
"share/applications" = ["data/pkgforge.desktop"]
"share/icons/hicolor/scalable/apps" = ["data/pkgforge.svg"]
"share/metainfo" = ["data/org.pkgforge.app.metainfo.xml"]
"share/polkit-1/actions" = [
    "data/org.pkgforge.app.policy",
    "packaging/polkit/org.pkgforge.helper.policy",
]
"share/pkgforge/scripts" = [
    "scripts/install_helper.sh",
    "scripts/pkgforge-privileged.sh",
    "scripts/install.sh",
    "scripts/uninstall.sh",
]
"share/bash-completion/completions" = ["data/completions/pkgforge.bash"]
"share/zsh/site-functions" = ["data/completions/_pkgforge"]

[tool.pytest.ini_options]
timeout = 120
timeout_method = "signal"
addopts = "-q --tb=short -m 'not bench'"
# `pytest -m bench` sadece performans regresyon testlerini çalıştırır;
# normal `pytest` çağrısında atlanır (jitter-sensitive, izole çalışmalı).
# SEC-SEGFAULT (titrek coverage+Qt native crash) tanilamasi: faulthandler
# segfault aninda C/Python yigin dokumu uretir; timeout ise 120s asan
# testlerde iz doker. Tekrar gorulurse kok-neden analizi bu izle yapilir.
faulthandler_timeout = 120

# F5.8: mutmut mutation-testing pilot config (calistirma: python -m mutmut run).
# NOT: mutmut 3.x kaynaklari izole bir mutants/ dizinine kopyalar; bu
# projenin ust-seviye modulleri (config, i18n) o dizinde import edilemedigi
# icin conftest ImportError verir. Asilmasi gereken bilinen kisit icin
# ROADMAP F5.8 notuna bakin.
[tool.mutmut]
# Kritik moduller: installer (Faz 5 kampanyasi %99.1) + security (Tur-65 kampanyasi).
# Calistirma: rm -rf mutants && .venv/bin/mutmut run  (test degisince mutants/ silinmeli).
source_paths = ["core/installer.py", "core/security.py"]
pytest_add_cli_args_test_selection = ["tests/test_installer_units.py", "tests/test_security_pure_logic.py", "tests/test_security.py", "tests/test_security_sweep.py", "tests/test_security_mutmut_round65.py"]
